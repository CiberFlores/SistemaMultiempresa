<!doctype html>

<html lang="es">

<head>

  <!-- ===================================== -->
  <!-- CONFIGURACION GENERAL -->
  <!-- ===================================== -->

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Arca Nova | Sistema de Ventas e Inventario
  </title>


  <!-- ===================================== -->
  <!-- ICONO DE LA PAGINA WEB -->
  <!-- ===================================== -->

  <link
    rel="icon"
    type="image/png"
    sizes="64x64"
    href="/brand/arca-nova-mark.png"
  />


  <!-- ===================================== -->
  <!-- ARCA NOVA GO PWA -->
  <!-- ===================================== -->

  <!--
    ESTE ARCHIVO PERMITE QUE EL NAVEGADOR
    RECONOZCA NUESTRA APLICACION INSTALABLE.

    LOS PERMISOS Y EL BOTON PERSONALIZADO
    SE CONTROLAN DESDE REACT Y FIREBASE.
  -->

  <script>
    // Solo las páginas de la app llevan manifiesto, y cada empresa el suyo
    (function () {
      var partes = location.pathname.split("/");
      if (partes[1] !== "admin-movil") return;
      var empresa = /^[A-Za-z0-9_-]+$/.test(partes[2] || "") ? partes[2] : "";
      var listo = empresa && navigator.serviceWorker && navigator.serviceWorker.controller;
      if (empresa && !listo) return;
      var l = document.createElement("link");
      l.rel = "manifest";
      l.href = listo ? "/m/" + empresa + "/manifest.webmanifest" : "/manifest.webmanifest";
      document.head.appendChild(l);
    })();
  </script>


  <!-- ===================================== -->
  <!-- COLOR PRINCIPAL -->
  <!-- ===================================== -->

  <meta
    name="theme-color"
    content="#080d1d"
  />


  <!-- ===================================== -->
  <!-- COMPATIBILIDAD CON ANDROID -->
  <!-- ===================================== -->

  <meta
    name="mobile-web-app-capable"
    content="yes"
  />


  <!-- ===================================== -->
  <!-- COMPATIBILIDAD CON IPHONE Y IPAD -->
  <!-- ===================================== -->

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  />

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  />


  <!-- ===================================== -->
  <!-- ICONO DE ARCA NOVA GO -->
  <!-- ===================================== -->

  <link
    rel="apple-touch-icon"
    href="/icons/arca-nova-192.png"
  />

</head>


<body>

  <!-- ===================================== -->
  <!-- CONTENEDOR PRINCIPAL DE REACT -->
  <!-- ===================================== -->

  <div id="root"></div>


  <!-- ===================================== -->
  <!-- INICIAR APLICACION -->
  <!-- ===================================== -->

  <script
    type="module"
    src="/src/main.jsx"
  ></script>

</body>

</html>
